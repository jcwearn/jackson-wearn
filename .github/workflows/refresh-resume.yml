name: Refresh resume

# The resume lives in jcwearn/resume, which rebuilds out/ on every merge there.
# Nothing about that reaches this repo on its own: scripts/fetch-resume.ts runs
# as prebuild, and prebuild only runs when Cloudflare Pages builds, which only
# happens when this repo gets a commit. So editing the resume and not touching
# this repo for a month left the site showing a month-old resume.
#
# This closes that gap by polling. Polling rather than a repository_dispatch
# from the resume repo, deliberately: dispatch needs a cross-repo token that
# expires, and its failure mode is silence -- exactly the staleness this exists
# to prevent. A schedule needs no credentials at all, because the resume repo is
# public and this reads a plain raw URL.

on:
  schedule:
    # 06:20 UTC. Off the hour because scheduled runs cluster there and get
    # delayed; the exact minute does not matter for a daily resume check.
    - cron: '20 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: refresh-resume
  cancel-in-progress: false

jobs:
  refresh:
    name: Fetch the resume and commit any change
    runs-on: ubuntu-latest
    outputs:
      # Whether this run actually committed. The deploy job below needs it
      # because a push made with the default GITHUB_TOKEN does NOT trigger
      # `on: push` workflows -- GitHub blocks that to prevent recursion -- so
      # deploy.yml never sees this commit, and the site would silently stop
      # updating while this job kept reporting success.
      changed: ${{ steps.commit.outputs.changed }}
      # The commit this run pushed. The deploy job cannot work it out for
      # itself: github.sha is the head this RUN started at, which is the
      # commit BEFORE the one below. See the comment on `deploy:`.
      sha: ${{ steps.commit.outputs.sha }}
    timeout-minutes: 10
    permissions:
      # The repo default is read-only; this job needs to push the refreshed
      # files. That push is what triggers the Pages rebuild.
      contents: write

    steps:
      # fetch-depth 0 rather than checkout's default of 1: the push below
      # rebases when main has moved, and a one-commit repo has nothing to
      # rebase onto.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: '.node-version'
          cache: 'npm'

      - name: Install
        run: npm ci

      # The script writes only when the bytes actually differ, and never fails
      # the run -- an unreachable GitHub leaves the committed copies in place.
      - name: Fetch
        run: npm run resume:fetch

      # Commits land as me, SSH-signed, so a refresh reads the same as any other
      # commit on main instead of an unsigned bot row.
      #
      # COMMIT_SIGNING_KEY is the account-wide signing key -- the same one the
      # private repos hold as PUBLIC_SYNC_SIGNING_KEY, under a name that means
      # something here, since this repo has no public-sync workflow. Its public
      # half is registered on the account as a Signing key; an Authentication
      # key would push fine and simply never verify.
      - name: Commit if changed
        id: commit
        env:
          SIGNING_KEY: ${{ secrets.COMMIT_SIGNING_KEY }}
        run: |
          set -euo pipefail
          if git diff --quiet -- src/content/resume.json public/resume.pdf; then
            echo "Resume already matches upstream; nothing to do."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # No unsigned fallback: quietly pushing unsigned is the thing this is
          # here to stop, so an absent key is an error rather than a downgrade.
          if [ -z "$SIGNING_KEY" ]; then
            echo "::error::COMMIT_SIGNING_KEY is empty -- refusing to push unsigned."
            exit 1
          fi

          # Mode before contents, so the key is never briefly world-readable.
          # RUNNER_TEMP rather than the working directory: the repo is checked
          # out at the workspace root, and a private key inside the tree is one
          # stray `git add -A` away from being committed.
          install -m 600 /dev/null "$RUNNER_TEMP/signing-key"
          printf '%s\n' "$SIGNING_KEY" > "$RUNNER_TEMP/signing-key"

          git config gpg.format ssh
          git config user.signingkey "$RUNNER_TEMP/signing-key"
          git config commit.gpgsign true

          # Author and committer both, byte-identical: GitHub matches the
          # signature to the account by committer email, and collapses the two
          # into one line on the commit list only when the strings match.
          git config user.name "Jackson Wearn"
          git config user.email "jcwearn@users.noreply.github.com"

          git add src/content/resume.json public/resume.pdf
          git commit -m "chore: refresh resume from jcwearn/resume"

          # commit.gpgsign does not cover the commits a rebase RE-creates, and
          # the loop below rebases. Without this, one push race turns a signed
          # commit into an unsigned one.
          git config rebase.gpgSign true

          # main moves under this job -- a merged PR, a Renovate bump. The push
          # was previously a single attempt, so any of those rejected it,
          # failed the job, and dropped that day's refresh: the site kept
          # serving the older resume behind a red run nobody watches.
          for attempt in 1 2 3; do
            # Not `git verify-commit`: verifying an SSH signature locally needs
            # a gpg.ssh.allowedSignersFile the runner does not have, so it
            # would fail on a perfectly good signature. Checking the header
            # attached is what can be established here; GitHub verifies it
            # server-side.
            #
            # Inside the loop, not before it: a rebase re-creates the commit,
            # so a check that ran only once would not be checking the commit
            # that actually gets pushed.
            if ! git cat-file commit HEAD | grep -q '^gpgsig'; then
              echo "::error::Signing was configured but HEAD carries no signature."
              exit 1
            fi

            if git push; then break; fi

            if [ "$attempt" = 3 ]; then
              echo "::error::main kept moving under us; gave up after 3 pushes."
              exit 1
            fi

            echo "Push rejected -- main moved. Rebasing and retrying."
            git fetch origin main
            # FETCH_HEAD, not origin/main: a fetch with an explicit refspec
            # only updates the remote-tracking ref opportunistically, and the
            # one ref it is guaranteed to write is this one.
            git rebase FETCH_HEAD
          done

          # Read AFTER the push, and after any rebase. A rebase rewrites the
          # commit, so a SHA captured before this point names an object the
          # deploy job would fail to check out.
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "Pushed a signed, refreshed resume; the deploy job publishes it."

      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/signing-key"

      # Cheap insurance against publishing something unreadable. The fetch
      # script already rejects a non-PDF and a JSON that does not parse, but
      # this asserts the committed pair is coherent after the fact rather than
      # trusting the thing that just wrote them.
      - name: Verify what was committed
        run: |
          set -euo pipefail
          head -c 5 public/resume.pdf | grep -q '%PDF-'
          node -e "
            const r = require('./src/content/resume.json');
            if (!r.profile?.name) throw new Error('resume.json has no profile.name');
            if (!Array.isArray(r.experience) || !r.experience.length) throw new Error('resume.json has no experience');
            console.log('resume.json looks sane:', r.experience.length, 'roles');
          "

  # Publishes what the job above committed.
  #
  # This exists because of a GitHub rule that is easy to miss: a push made with
  # the default GITHUB_TOKEN does not trigger `on: push` workflows. Until now
  # that did not matter -- Cloudflare watched the repository directly and
  # rebuilt on any commit, whoever made it. With deploys in Actions, this commit
  # would land and never publish, with nothing going red: the site would just
  # keep showing an older resume.
  #
  # Calling the deploy workflow directly needs no extra credential. The
  # alternative -- pushing with a PAT or a GitHub App token so `on: push` fires
  # -- buys the same outcome for the cost of another long-lived secret.
  #
  # `ref` is not optional here, whatever the input says. A reusable workflow
  # inherits the CALLER's github context, so github.sha inside it is the head
  # this run started at -- the commit BEFORE the refresh above. Without it the
  # deploy checked that out, built it, and shipped it: run 32315077064
  # committed 1d5992c at 23:53:07 and deployed --commit-hash=b617c43 thirteen
  # seconds later, publishing the tree that did NOT contain the refreshed
  # resume. Green every time, for all three refreshes that have ever fired.
  # The only thing that caught the site up was an unrelated merge to main
  # firing deploy.yml against the real head.
  deploy:
    name: Publish the refreshed resume
    needs: refresh
    if: needs.refresh.outputs.changed == 'true'
    permissions:
      contents: read
      pull-requests: write
    uses: jcwearn/workflows/.github/workflows/cloudflare-pages-deploy.yaml@d88dd60ddaeeb65b628758a975492fb6a4f67b89 # v1
    with:
      project-name: jackson-wearn
      ref: ${{ needs.refresh.outputs.sha }}
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
