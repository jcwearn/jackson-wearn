<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#101828" />
    <meta
      name="description"
      content="Backend engineer with 10+ years building and operating high-scale APIs and distributed systems. Mostly Go, on Kubernetes. Portfolio, resume, and contact."
    />
    <title>Jackson Wearn</title>
    <link rel="canonical" href="https://jacksonwearn.com/" />

    <!--
      The share card. One card for the whole site rather than one per route --
      see the header of scripts/build-og.ts for why. Every URL here is absolute
      on purpose: a relative og:image is the usual reason a link pastes into
      iMessage as a blank rectangle. public/og.png is committed, and rebuilt by
      `npm run og:build`.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Jackson Wearn" />
    <meta property="og:url" content="https://jacksonwearn.com/" />
    <meta property="og:title" content="Jackson Wearn — Senior Software Engineer" />
    <meta
      property="og:description"
      content="Backend engineer with 10+ years building and operating high-scale APIs and distributed systems. Mostly Go, on Kubernetes. Portfolio, resume, and contact."
    />
    <meta property="og:image" content="https://jacksonwearn.com/og.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="A grayscale portrait of Jackson Wearn beside his name and the line Senior Software Engineer · Backend &amp; Infrastructure, on a dark card marked jacksonwearn.com."
    />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Jackson Wearn — Senior Software Engineer" />
    <meta
      name="twitter:description"
      content="Backend engineer with 10+ years building and operating high-scale APIs and distributed systems. Mostly Go, on Kubernetes. Portfolio, resume, and contact."
    />
    <meta name="twitter:image" content="https://jacksonwearn.com/og.png" />
  </head>
  <body>
    <div id="root" class="w-full"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
